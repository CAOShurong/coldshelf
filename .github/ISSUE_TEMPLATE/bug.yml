name: Bug report
description: Report a reproducible ColdShelf problem without exposing private catalog data.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Remove private file names, paths, drive labels, and catalog contents. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: ColdShelf version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: What were you trying to do?
      description: Describe the mounted path type, scan mode, and approximate scale without private names.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      placeholder: Exact commands and steps, with private path segments replaced.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private file names, paths, drive labels, and catalog data.
          required: true
        - label: This is not a security vulnerability.
          required: true
