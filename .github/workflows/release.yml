name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, attest, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]

      - name: Resolve release version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test release source
        run: go test -count=1 ./...

      - name: Build deterministic archives
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          go run ./build/release.go --version "${{ steps.version.outputs.value }}" --output dist

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          file: ./dist/coldshelf_${{ steps.version.outputs.value }}_linux_amd64.tar.gz
          format: spdx-json
          output-file: ./dist/coldshelf_${{ github.ref_name }}.spdx.json
          artifact-name: coldshelf_${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: true

      - name: Validate SBOM inventory
        shell: bash
        run: |
          sbom="dist/coldshelf_${GITHUB_REF_NAME}.spdx.json"
          jq -e '.packages | length > 5' "$sbom" >/dev/null
          jq -e '.packages | any(.name == "modernc.org/sqlite")' "$sbom" >/dev/null
          jq -e '.packages | any(.name == "github.com/skip2/go-qrcode")' "$sbom" >/dev/null
          jq -e '.packages | any(.name == "stdlib")' "$sbom" >/dev/null

      - name: Attest release archives
        uses: actions/attest@v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "ColdShelf $GITHUB_REF_NAME" \
            --generate-notes
